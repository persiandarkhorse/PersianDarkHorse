name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Scan tracked files for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan repository
        run: node scripts/secret-scan.mjs
